name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TaskCat-preview
          path: |
            dist/TaskCat-*.zip
            dist/TaskCat-*.zip.sha256
